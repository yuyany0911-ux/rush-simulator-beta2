<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUSH SIMULATOR | CLASSIC</title><link rel="stylesheet" href="style.css?v=46-mobile-fullscreen"></head><body>
<main id="appRoot" class="setup-mode"><header><h1><span class="rush-word">RUSH</span> <span>SIMULATOR</span></h1></header>
<section class="layout"><aside class="panel" id="settingsPanel"><h2>SPEC SETTINGS</h2><label>大当たり確率（1 / N）<input id="denom" type="number" min="1" step=".1" value="99.9"></label><label>ST回転数<input id="spins" type="number" min="1" max="10000" value="144"></label><h3>出玉振り分け</h3><div id="payouts"><div class="row"><input aria-label="出玉" type="number" min="0" value="3000"><input aria-label="割合" type="number" min="0" value="20"><span>%</span></div><div class="row"><input aria-label="出玉" type="number" min="0" value="1500"><input aria-label="割合" type="number" min="0" value="50"><span>%</span></div><div class="row"><input aria-label="出玉" type="number" min="0" value="300"><input aria-label="割合" type="number" min="0" value="30"><span>%</span></div></div><button id="add" class="sub">＋ 振り分け追加</button><p id="specInfo" class="info"></p><p id="error" class="error" role="alert"></p><label class="prealert-setting" for="prealertEnabled"><span><strong>先バレ機能</strong><small>新しい保留が入ったときの予告音</small></span><span class="prealert-choice"><input type="checkbox" id="prealertEnabled" checked><span>ON</span></span></label><label class="prealert-rate">先バレ信頼度<select id="prealertRate"><option value="0.25">25%</option><option value="0.40" selected>40%</option><option value="0.99">99%</option></select></label><button id="start" class="primary">設定完了・RUSH START</button></aside>
<div class="machine" id="machine"><div class="theater-bar"><button id="backSettings" type="button">⚙ スペック設定に戻る</button><span>RUSH THEATER MODE</span><button id="fullScreen" type="button">⛶ 全画面表示</button></div><div class="status"><div><small>ROUND</small><strong id="chain">0</strong></div><div><small>TOTAL GET</small><strong id="total">0 <em>玉</em></strong></div><div><small>REMAIN</small><strong id="remain">---</strong></div></div><div id="screen" class="screen"><video id="rushBackground" class="rush-video-bg" src="rush-background.mp4" muted loop playsinline webkit-playsinline preload="metadata" aria-hidden="true" tabindex="-1"></video><div class="scan"></div><span id="mode" hidden>STANDBY</span>
<div class="hud hud-left rush-bottom-counter"><div class="hud-caption">残り</div><div class="hud-value"><span id="hudRemain">---</span><small>回転</small></div><div class="hud-foot">REMAINING SPINS</div></div>
<div class="hud hud-right"><div class="hud-caption">RUSH COUNT</div><div class="hud-value"><span id="hudChain">00</span><small>連</small></div></div>
<div class="hud hud-total" aria-live="polite"><div class="hud-value"><span id="hudTotal">0</span><small>玉</small></div></div><div class="hold-area rush-bottom-holds"><div class="hold-title">HOLD / 保留</div><div class="hold-lamps" id="holdLamps" aria-label="5個の保留"></div><div class="hold-note" id="holdNote">STANDBY</div></div><div id="message" class="message" hidden>READY</div><div class="digits reel-bank" aria-label="3桁の回転図柄"><div class="reel" id="reel1"><div class="reel-track" id="track1"><span id="d1">7</span></div></div><div class="reel" id="reel2"><div class="reel-track" id="track2"><span id="d2">7</span></div></div><div class="reel" id="reel3"><div class="reel-track" id="track3"><span id="d3">7</span></div></div></div><div id="submessage" class="submessage" hidden>設定して RUSH START</div><div id="flash" class="flash"></div></div><div class="controls"><button id="spin" disabled>1回転 消化</button><button id="auto" disabled>回転オート START</button><button id="instant" disabled>一括消化</button><button id="sound">SOUND: ON</button><button id="bgmToggle" type="button">BGM: ON</button></div><div class="auto-options"><label>自動消化速度 <select id="speed"><option value="800" selected>高速（約0.8秒）</option><option value="1200">やや高速（約1.2秒）</option><option value="2000">標準（約2秒）</option><option value="3000">ゆっくり（約3秒）</option><option value="5000">超ゆっくり（約5秒）</option></select></label><span id="progress">消化回転数：0</span></div><div class="hold-guide">保留期待度：白（通常）／青10%／緑30%／紫60%／赤80%／金90%／虹98% </div><div class="history"><h3>変動履歴 <button id="clearHistory" class="sub">履歴を消去</button></h3><div id="historyLog" aria-live="off">RUSHを開始すると履歴が表示されます。</div></div><div class="result" id="result">最高記録：<span id="best">0玉 / 0連</span></div></div></section></main><script src="script.js?v=46-mobile-fullscreen"></script></body></html>
